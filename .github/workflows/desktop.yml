name: Windows desktop preview
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'extension/**', 'site/core.js', 'site/roam/focus-bridge.js', 'scripts/**', 'tests/**', 'package*.json', 'product/TIMER_AND_MUSIC.txt', 'product/DESKTOP_README.txt', 'product/DESKTOP_RELEASE.md', 'product/MONKEY_QUOTE_BANK.md', 'product/MONKEY_QUOTE_SOURCES.md', 'product/MONKEY_QUOTE_SOURCES_ADDITIONS.md', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-preview
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Verify modified-release native timer input and music lifecycle
        timeout-minutes: 4
        run: npm run test:modified-desktop
      - name: Install browser test runtime
        run: npx playwright install chromium
      - name: Verify focus controls and scrolling
        run: npm run test:shield-ui
      - name: Verify timer synchronization and celebration polish
        run: npm run test:polish
      - name: Verify play interactions and panel navigation
        run: npm run test:play
      - name: Verify timer placement and real music decoding and looping
        timeout-minutes: 3
        run: npm run test:timer-music
      - name: Verify video under the modified native overlay
        timeout-minutes: 3
        run: npm run test:video
      - name: Verify browser blocking extension
        run: npm run test:extension
      - name: Package from the checksum-verified owner-supplied modified release
        run: npm run package:modified
      - name: Verify timer and audio in the actual packaged download
        shell: pwsh
        timeout-minutes: 4
        run: |
          Expand-Archive dist/Buildlings-Windows-x64.zip dist/package-check
          $env:BUILDLINGS_PACKAGE_EXE = (Resolve-Path dist/package-check/Buildlings.exe).Path
          npm run test:modified-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Buildlings-Windows-x64
          path: |
            dist/Buildlings-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/modified-release-verification.json
          retention-days: 14
      - name: Publish downloadable preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "desktop-preview-$env:GITHUB_RUN_NUMBER" dist/Buildlings-Windows-x64.zip dist/SHA256SUMS.txt dist/modified-release-verification.json --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title 'Mischief 0.11.1 — movable timer and optional background music' --notes-file product/DESKTOP_RELEASE.md
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-evidence
          path: test-results/
          if-no-files-found: ignore
