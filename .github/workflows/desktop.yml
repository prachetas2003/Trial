name: Windows desktop preview
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'site/core.js', 'scripts/**', 'tests/**', 'package*.json', 'product/DESKTOP_README.txt', 'product/DESKTOP_RELEASE.md', 'product/MONKEY_QUOTE_BANK.md', 'product/MONKEY_QUOTE_SOURCES.md', 'product/MONKEY_QUOTE_SOURCES_ADDITIONS.md', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-preview
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Verify native Windows interaction
        run: npm run test:desktop
      - name: Package Windows application
        run: npm run package:desktop
      - name: Create portable download
        shell: pwsh
        run: |
          Copy-Item product/DESKTOP_README.txt dist/Buildlings-win32-x64/README.txt
          Copy-Item product/MONKEY_QUOTE_SOURCES.md dist/Buildlings-win32-x64/QUOTE_SOURCES.md
          Copy-Item product/MONKEY_QUOTE_SOURCES_ADDITIONS.md dist/Buildlings-win32-x64/QUOTE_SOURCES_ADDITIONS.md
          Compress-Archive -Path dist/Buildlings-win32-x64/* -DestinationPath dist/Buildlings-Windows-x64.zip
          $digest = (Get-FileHash dist/Buildlings-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  Buildlings-Windows-x64.zip" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Buildlings-Windows-x64
          path: |
            dist/Buildlings-Windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish downloadable preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "desktop-preview-$env:GITHUB_RUN_NUMBER" dist/Buildlings-Windows-x64.zip dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --title 'Buildlings 0.6.1 — balanced quotes every 12 seconds' --notes-file product/DESKTOP_RELEASE.md
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-evidence
          path: test-results/
          if-no-files-found: ignore
